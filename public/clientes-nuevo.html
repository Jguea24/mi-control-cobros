<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Registrar nuevo cliente - Mi Control de Cobros">
  <meta name="theme-color" content="#1d4ed8">
  <title>Nuevo cliente | Mi Control de Cobros</title>

  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            primary: {
              50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe',
              300: '#93c5fd', 400: '#60a5fa', 500: '#3b82f6',
              600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a'
            }
          },
          boxShadow: { soft: '0 10px 30px rgba(15, 23, 42, 0.06)' }
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>

<body class="min-h-screen bg-slate-50 font-sans text-slate-900 antialiased">
  <main class="min-h-screen px-4 py-6 sm:px-6 lg:px-8 lg:py-10">
    <div class="mx-auto max-w-4xl">

      <!-- Encabezado -->
      <div class="mb-6">
        <a href="clientes.html" class="mb-5 inline-flex items-center gap-2 text-sm font-bold text-slate-500 transition hover:text-primary-700">
          ← Volver a clientes
        </a>
        <div class="flex items-end justify-between gap-4">
          <div>
            <div class="mb-2 inline-flex items-center gap-2 rounded-full bg-primary-50 px-3 py-1 text-xs font-bold text-primary-700">
              👤 Registro de cliente
            </div>
            <h1 class="text-3xl font-black tracking-tight text-slate-950 sm:text-4xl">Nuevo cliente</h1>
            <p class="mt-2 text-sm leading-6 text-slate-500 sm:text-base">Registra la información principal del cliente.</p>
          </div>
        </div>
      </div>

      <!-- Formulario -->
      <form id="clienteForm" class="overflow-hidden rounded-3xl border border-slate-200/80 bg-white shadow-soft" novalidate>
        <input id="clienteId" name="clienteId" type="hidden">

        <div class="border-b border-slate-100 bg-gradient-to-r from-primary-50/70 to-white px-6 py-6 sm:px-8">
          <div class="flex items-center gap-4">
            <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-gradient-to-br from-primary-500 to-primary-700 text-white shadow-lg shadow-primary-600/25">+</div>
            <div>
              <h2 class="text-lg font-black text-slate-950">Datos del cliente</h2>
              <p class="mt-1 text-sm text-slate-500">Completa los campos correspondientes.</p>
            </div>
          </div>
        </div>

        <div class="space-y-8 p-6 sm:p-8">
          <!-- Datos personales -->
          <section aria-labelledby="datosPersonalesTitulo">
            <div class="mb-5 flex items-center gap-3">
              <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-blue-50 text-xs font-black text-primary-600">01</span>
              <div>
                <h3 id="datosPersonalesTitulo" class="text-sm font-black text-slate-900">Datos personales</h3>
                <p class="text-xs text-slate-400">Información básica del cliente</p>
              </div>
            </div>

            <div class="grid gap-5 md:grid-cols-2">
              <div class="md:col-span-2">
                <label for="nombre" class="mb-2 block text-sm font-bold text-slate-700">
                  Nombre completo <span class="ml-1 text-xs font-semibold text-red-500">Obligatorio</span>
                </label>
                <input id="nombre" name="nombre" type="text" autocomplete="name" required placeholder="Ej. Juan Pérez"
                  class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3.5 text-sm font-medium text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-primary-500 focus:bg-white focus:ring-4 focus:ring-primary-100/50">
              </div>

              <div>
                <label for="telefono" class="mb-2 block text-sm font-bold text-slate-700">Teléfono</label>
                <input id="telefono" name="telefono" type="tel" autocomplete="tel" inputmode="tel" placeholder="099 999 9999"
                  class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3.5 text-sm font-medium text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-primary-500 focus:bg-white focus:ring-4 focus:ring-primary-100/50">
              </div>

              <div>
                <label for="correo" class="mb-2 block text-sm font-bold text-slate-700">Correo electrónico</label>
                <input id="correo" name="correo" type="email" autocomplete="email" placeholder="cliente@correo.com"
                  class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3.5 text-sm font-medium text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-primary-500 focus:bg-white focus:ring-4 focus:ring-primary-100/50">
              </div>
            </div>
          </section>

          <!-- Información adicional -->
          <section aria-labelledby="informacionAdicionalTitulo">
            <div class="mb-5 flex items-center gap-3">
              <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-violet-50 text-xs font-black text-violet-600">02</span>
              <div>
                <h3 id="informacionAdicionalTitulo" class="text-sm font-black text-slate-900">Información adicional</h3>
                <p class="text-xs text-slate-400">Datos complementarios</p>
              </div>
            </div>

            <div class="space-y-5">
              <div>
                <label for="direccion" class="mb-2 block text-sm font-bold text-slate-700">Dirección</label>
                <input id="direccion" name="direccion" type="text" autocomplete="street-address" placeholder="Sector, calle o referencia"
                  class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3.5 text-sm font-medium text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-primary-500 focus:bg-white focus:ring-4 focus:ring-primary-100/50">
              </div>

              <div>
                <div class="mb-2 flex items-center justify-between">
                  <label for="notas" class="block text-sm font-bold text-slate-700">Notas</label>
                  <span class="text-xs font-medium text-slate-400">Opcional</span>
                </div>
                <textarea id="notas" name="notas" rows="5" placeholder="Acuerdos, referencias o detalles importantes..."
                  class="w-full resize-none rounded-xl border border-slate-200 bg-slate-50 px-4 py-3.5 text-sm text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-primary-500 focus:bg-white focus:ring-4 focus:ring-primary-100/50"></textarea>
              </div>
            </div>
          </section>

          <!-- Acciones -->
          <section class="border-t border-slate-100 pt-6">
            <div class="flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
              <a href="clientes.html" class="inline-flex items-center justify-center rounded-xl border border-slate-200 bg-white px-5 py-3.5 text-sm font-bold text-slate-700 transition hover:bg-slate-50">
                Cancelar
              </a>
              <button id="saveClienteButton" type="submit" class="inline-flex items-center justify-center gap-2 rounded-xl bg-primary-600 px-6 py-3.5 text-sm font-black text-white shadow-lg shadow-primary-600/25 transition hover:bg-primary-700 focus:outline-none focus:ring-4 focus:ring-primary-200">
                ✓ Guardar cliente
              </button>
            </div>
            <p id="clienteMessage" class="mt-3 hidden rounded-xl px-4 py-3 text-sm font-semibold" role="alert" aria-live="polite"></p>
          </section>
        </div>
      </form>
    </div>
  </main>

  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/clientes.js"></script>
  <script src="js/pwa.js"></script>

</body>
</html>
